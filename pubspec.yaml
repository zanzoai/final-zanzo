name: zanzo_frontend
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # 🌐 Networking & Storage
  http: ^1.2.2
  http_parser: ^4.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.5.1

  # 🧩 UI & Utils
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  intl: ^0.20.2
  photo_view: ^0.14.0   # ✅ Flutter 3.8+ compatible

  # ✅ Supabase
  supabase_flutter: ^2.6.0

  # 🔔 Push Notifications (Phase 1 — token registration)
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10

  # 💳 Payments
  flutter_stripe: ^11.0.0

  # 📍 Maps & Location (modern)
  google_maps_flutter: ^2.6.0
  geolocator: ^12.0.0
  geocoding: ^2.1.0
  flutter_typeahead: ^4.8.0
  google_api_headers: ^1.6.0

  # 🔐 Permissions
  permission_handler: ^12.0.1

  # 📸 Image capture + crop (modern)
  image_picker: ^1.1.2
  image_cropper: ^11.0.0
  camera: ^0.10.5+6

  # 🧠 OCR
  google_mlkit_text_recognition: 0.13.1


  # 🎙️ Voice
  speech_to_text: ^7.4.0
  web_socket_channel: ^2.4.0
  flutter_sound: ^9.28.0
  camera_camera: ^3.0.0
  file_picker: ^10.3.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  photo_view: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/zanzo_logo.png"
  adaptive_icon_background: "#FCFAF6"
  adaptive_icon_foreground: "assets/images/zanzo_logo.png"
  min_sdk_android: 24
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FCFAF6"
  image: assets/images/zanzo_splash.png
  android: true
  ios: true
  android_12:
    color: "#FCFAF6"
    image: assets/images/zanzo_splash.png
    icon_background_color: "#FCFAF6"